name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (unit + end-to-end)
        run: pytest -q

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: mypy

  package:
    name: build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

  mutation-gate:
    name: testteeth on changed code (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"  # the suite needs the MCP SDK and the pytest plugins it tests against
      - name: Grade tests for functions changed in this PR
        run: testteeth run --base "origin/${{ github.base_ref }}" --fail-under 70 --json mutation.json

  engines:
    name: TypeScript + Rust examples end-to-end (StrykerJS, cargo-mutants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/ts-payments/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm ci --prefix examples/ts-payments
      - name: Real StrykerJS and cargo-mutants runs (weak and strong suites)
        env:
          TESTTEETH_REQUIRE_ENGINES: "1"
        run: pytest -q -m engines -rs
      - name: Gate the strong suites with the CLI
        run: |
          testteeth run --root examples/ts-payments --engine-config stryker.strong.json --fail-under 95
          testteeth run --root examples/rust-payments --engine-args "-- --test strong" --fail-under 95
