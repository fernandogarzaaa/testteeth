[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "testteeth"
version = "0.1.0"
description = "Grade AI-written tests with fast, git-diff-aware mutation testing, and hand coding agents precise briefs for the tests they are missing (CLI, pytest plugin, MCP server)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fernando Garza" }]
keywords = ["mutation testing", "pytest", "testing", "mcp", "ai agents", "claude code", "cursor", "test quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pytest>=7.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["mcp>=1.2", "build", "twine"]

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/testteeth"
Issues = "https://github.com/fernandogarzaaa/testteeth/issues"

[project.scripts]
testteeth = "testteeth.cli:main"
testteeth-mcp = "testteeth.mcp_server:main"

[project.entry-points.pytest11]
testteeth = "testteeth.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/testteeth"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that spawn pytest subprocesses"]

[tool.testteeth]
paths = ["src/testteeth"]
test_args = ["tests", "-m", "not slow"]
# The tracer is tested in a subprocess (it cannot trace itself) and __main__ is a 1-line shim.
exclude = ["_tracer.py", "__main__.py"]
